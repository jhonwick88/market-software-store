# =========================================================================
# Nginx Configuration for Frontend Marketplace (labspintar.com)
# Place in: /etc/nginx/sites-available/labspintar.com
# Symlink: ln -s /etc/nginx/sites-available/labspintar.com /etc/nginx/sites-enabled/
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name labspintar.com www.labspintar.com;

    # Root directory pointing to built React client
    # PATH_PLACEHOLDER will be replaced dynamically by deploy.sh
    root /var/www/pintarlabs-software-store/client/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static Assets Caching (JS, CSS, Images, Fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy to dynamic backend sitemap / robots if requested through main domain
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_set_header Host market.labspintar.com;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000/robots.txt;
        proxy_set_header Host market.labspintar.com;
    }

    # Proxy uploads from main domain to server uploads
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host market.labspintar.com;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA Routing (React Router fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
