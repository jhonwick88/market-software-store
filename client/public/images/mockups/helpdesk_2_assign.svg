<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="1100" cy="150" r="280" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="600" r="240" fill="#1d4ed8" opacity="0.12" filter="url(#glow)" />

  <!-- Window Frame -->
  <rect x="40" y="40" width="1200" height="640" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <path d="M 40 60 A 20 20 0 0 1 60 40 L 1220 40 A 20 20 0 0 1 1240 60 L 1240 95 L 40 95 Z" fill="#1e293b" />
  <circle cx="70" cy="67" r="6" fill="#ef4444" />
  <circle cx="90" cy="67" r="6" fill="#f59e0b" />
  <circle cx="110" cy="67" r="6" fill="#10b981" />

  <text x="140" y="72" fill="#94a3b8" font-size="13" font-weight="600">PintarLabs Professional Suite — PintarHelpdesk — Penugasan Teknisi & Estimasi Jam</text>
  <rect x="1080" y="55" width="130" height="26" rx="13" fill="#3b82f6" opacity="0.2" />
  <text x="1145" y="72" fill="#3b82f6" font-size="11" font-weight="700" text-anchor="middle">WORK ORDER</text>

  <!-- Sidebar -->
  <rect x="40" y="95" width="220" height="585" fill="#0b1120" />
  
  <!-- App Logo in Sidebar -->
  <rect x="65" y="125" width="36" height="36" rx="10" fill="url(#primaryGrad)" />
  <text x="83" y="148" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">⚡</text>
  <text x="112" y="140" fill="#ffffff" font-size="14" font-weight="700">PintarLabs</text>
  <text x="112" y="155" fill="#64748b" font-size="10" font-weight="600">Task Teknisi</text>

  <!-- Sidebar Menu Items -->
  <g transform="translate(65, 195)">
    <rect x="0" y="0" width="170" height="38" rx="10" fill="url(#primaryGrad)" opacity="0.9" />
    <text x="40" y="24" fill="#ffffff" font-size="13" font-weight="700">📊 Dashboard Utama</text>

    <text x="40" y="68" fill="#94a3b8" font-size="13" font-weight="600">📑 Operasional & Data</text>
    <text x="40" y="112" fill="#94a3b8" font-size="13" font-weight="600">🔍 Pencarian & Filter</text>
    <text x="40" y="156" fill="#94a3b8" font-size="13" font-weight="600">🖨️ Hardware & Printer</text>
    <text x="40" y="200" fill="#94a3b8" font-size="13" font-weight="600">📈 Laporan & Analitik</text>
    <text x="40" y="244" fill="#94a3b8" font-size="13" font-weight="600">⚙️ Pengaturan Sistem</text>
  </g>

  <!-- Main Canvas Area -->
  <!-- Top Stat Cards Grid -->
  <g transform="translate(285, 125)">
    <!-- Main Title & Subtitle -->
    <text x="0" y="15" fill="#ffffff" font-size="22" font-weight="800">PintarHelpdesk — Penugasan Teknisi & Estimasi Jam</text>
    <text x="0" y="38" fill="#94a3b8" font-size="13" font-weight="500">Distribusi Tiket Otomatis, Status Pengerjaan & Suku Cadang</text>

    <!-- 3 Stat KPI Cards -->
    <g transform="translate(0, 60)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="290" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="600">Status Sistem</text>
      <text x="20" y="65" fill="#ffffff" font-size="24" font-weight="800">100% Aktif</text>
      <text x="20" y="85" fill="#10b981" font-size="11" font-weight="600">● Local-First LAN Ready</text>

      <!-- Card 2 -->
      <rect x="310" y="0" width="290" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="330" y="30" fill="#94a3b8" font-size="11" font-weight="600">Total Transaksi</text>
      <text x="330" y="65" fill="#3b82f6" font-size="24" font-weight="800">1,420 Item</text>
      <text x="330" y="85" fill="#38bdf8" font-size="11" font-weight="600">↑ Real-time sync</text>

      <!-- Card 3 -->
      <rect x="620" y="0" width="290" height="100" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="640" y="30" fill="#94a3b8" font-size="11" font-weight="600">Kecepatan Proses</text>
      <text x="640" y="65" fill="#10b981" font-size="24" font-weight="800">< 0.05 Detik</text>
      <text x="640" y="85" fill="#94a3b8" font-size="11" font-weight="600">⚡ Database Lokal Cepat</text>
    </g>

    <!-- Table Data Section -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="910" height="340" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      
      <!-- Table Header -->
      <rect x="0" y="0" width="910" height="45" rx="16" fill="#1e293b" />
      <text x="25" y="28" fill="#cbd5e1" font-size="12" font-weight="700">KODE / REF</text>
      <text x="180" y="28" fill="#cbd5e1" font-size="12" font-weight="700">DESKRIPSI DATA</text>
      <text x="480" y="28" fill="#cbd5e1" font-size="12" font-weight="700">STATUS / KATEGORI</text>
      <text x="720" y="28" fill="#cbd5e1" font-size="12" font-weight="700">NILAI / HASIL</text>

      <!-- Row 1 -->
      <line x1="0" y1="95" x2="910" y2="95" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="75" fill="#38bdf8" font-size="12" font-weight="600">PL-00918</text>
      <text x="180" y="75" fill="#ffffff" font-size="12" font-weight="600">Data Operasional Terverifikasi</text>
      <rect x="480" y="58" width="90" height="24" rx="12" fill="#10b981" opacity="0.2" />
      <text x="525" y="74" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">SUKSES</text>
      <text x="720" y="75" fill="#ffffff" font-size="12" font-weight="700">Rp 1.450.000</text>

      <!-- Row 2 -->
      <line x1="0" y1="145" x2="910" y2="145" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="125" fill="#38bdf8" font-size="12" font-weight="600">PL-00919</text>
      <text x="180" y="125" fill="#ffffff" font-size="12" font-weight="600">Sinkronisasi Perangkat Keras</text>
      <rect x="480" y="108" width="90" height="24" rx="12" fill="#3b82f6" opacity="0.2" />
      <text x="525" y="124" fill="#3b82f6" font-size="11" font-weight="700" text-anchor="middle">TERHUBUNG</text>
      <text x="720" y="125" fill="#ffffff" font-size="12" font-weight="700">Port COM3 / LAN</text>

      <!-- Row 3 -->
      <line x1="0" y1="195" x2="910" y2="195" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="175" fill="#38bdf8" font-size="12" font-weight="600">PL-00920</text>
      <text x="180" y="175" fill="#ffffff" font-size="12" font-weight="600">Penerbitan Dokumen Otomatis</text>
      <rect x="480" y="158" width="90" height="24" rx="12" fill="#8b5cf6" opacity="0.2" />
      <text x="525" y="174" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">TERCETAK</text>
      <text x="720" y="175" fill="#ffffff" font-size="12" font-weight="700">PDF & Struk 80mm</text>

      <!-- Row 4 -->
      <line x1="0" y1="245" x2="910" y2="245" stroke="#334155" stroke-width="0.8" />
      <text x="25" y="225" fill="#38bdf8" font-size="12" font-weight="600">PL-00921</text>
      <text x="180" y="225" fill="#ffffff" font-size="12" font-weight="600">Validasi Rekonsiliasi Akhir</text>
      <rect x="480" y="208" width="90" height="24" rx="12" fill="#10b981" opacity="0.2" />
      <text x="525" y="224" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">VALID</text>
      <text x="720" y="225" fill="#ffffff" font-size="12" font-weight="700">100% Akurat</text>

      <!-- Action Button in Table Footer -->
      <rect x="730" y="280" width="155" height="38" rx="10" fill="url(#primaryGrad)" />
      <text x="807" y="304" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Export Laporan Excel</text>
    </g>
  </g>
</svg>